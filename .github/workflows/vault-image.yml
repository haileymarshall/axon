name: vault-image

on:
  push:
    branches: [master]
    paths: ["axon/**", "Dockerfile", "requirements.txt", ".github/workflows/vault-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axon-vault:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/axon-vault:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - run: echo "digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
