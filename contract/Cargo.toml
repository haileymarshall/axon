[package]
name = "axon-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Axon: ownership ledger for AI models trained together on private data, on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.6"

[dev-dependencies]
near-sdk = { version = "5.6", features = ["unit-testing"] }
ed25519-dalek = "2"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
